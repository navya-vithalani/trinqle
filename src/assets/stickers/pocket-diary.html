<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Diary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff3f6;--card:#fff;--ink:#5b4350;--soft:#a58b98;--pink:#ff8fb1;--mint:#9fe3c8;--lav:#c9b3f5;--peach:#ffd2b0;--line:#f6dfe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2032;--card:#382b43;--ink:#f7e8f0;--soft:#b9a0b0;--line:#4a3a57}}
:root[data-theme="dark"]{--bg:#2a2032;--card:#382b43;--ink:#f7e8f0;--soft:#b9a0b0;--line:#4a3a57}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;font-size:16px;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 16px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 var(--line);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.row+.row{border-top:2px dashed var(--line)}
.lbl{flex:1;min-width:0}
.sw{width:56px;height:32px;border-radius:99px;background:var(--line);border:0;position:relative;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.sw.on{background:var(--mint)}.sw.on::after{transform:translateX(24px)}
.stars button{border:0;background:none;font-size:26px;padding:0 1px;color:var(--line);transition:transform .2s;cursor:pointer}
.stars button.on{color:#ffb84d}.stars button:active{transform:scale(1.5) rotate(15deg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-width:0}
input:focus,select:focus{outline:3px solid var(--lav)}
.txt{width:100%;margin-top:6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:99px;padding:12px 22px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #e0678f;cursor:pointer;transition:transform .15s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.alt{background:var(--lav);box-shadow:0 4px 0 #a48bd6}.btn.ghost{background:var(--line);color:var(--ink);box-shadow:none}
.mic{border:0;background:var(--line);border-radius:50%;width:34px;height:34px;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
nav button{flex:1;max-width:120px;border:0;background:none;font:inherit;font-size:12px;color:var(--soft);padding:6px;border-radius:16px}
nav button b{display:block;font-size:22px;font-weight:400;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
nav button.on{color:var(--ink);background:var(--bg)}nav button.on b{transform:translateY(-3px) scale(1.2)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--line)}
.big{display:flex;gap:10px}.big div{flex:1;background:var(--bg);border-radius:18px;padding:10px;text-align:center}.big b{display:block;font-size:24px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);border-radius:9px;transition:width .6s}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;animation:pop .3s both;z-index:9}
.lock{text-align:center;padding:26px 10px}.lock .e{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.x{border:0;background:none;color:var(--soft);font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return fmt(d)};
// storage: IndexedDB with in-memory fallback
let mem={};
const dbp=new Promise(r=>{try{const q=indexedDB.open('pocket-diary',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbGet=async k=>{const d=await dbp;if(!d)return mem[k];return new Promise(r=>{try{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}})};
const idbPut=async(k,v)=>{mem[k]=v;const d=await dbp;if(!d)return;return new Promise(r=>{try{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}})};

const defSchema=[
{id:'mood',title:'Mood',emoji:'🌸',fields:[{id:'mood',label:'Overall mood',type:'rating'},{id:'energy',label:'Energy',type:'rating'},{id:'word',label:'One word for today',type:'text'}]},
{id:'routine',title:'Routine',emoji:'📚',fields:[{id:'study',label:'Studies',type:'toggle'},{id:'code',label:'Coding',type:'toggle'},{id:'exercise',label:'Exercise',type:'toggle'}]},
{id:'health',title:'Body',emoji:'🍓',fields:[{id:'headbath',label:'Head bath',type:'toggle'},{id:'sleep',label:'Hours slept',type:'number'},{id:'water',label:'Glasses of water',type:'number'}]}];
let S={schema:defSchema,entries:{},archives:[],cycle:28,cycleStart:fmt(new Date())};
let tab='today',cur={},curDate='',unlocked=false,sel='',viewing=null;

function entryDate(){const n=new Date();if(n.getHours()<3)n.setDate(n.getDate()-1);return fmt(n)}
function isOpen(){const h=new Date().getHours();return h>=21||h<3}
function save(){return idbPut('state',S)}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const allFields=(sch=S.schema)=>sch.flatMap(s=>s.fields.filter(f=>!f.archived).map(f=>({...f,sec:s.title})));

function render(){
 $('#nav').innerHTML=[['today','🌙','Tonight'],['insights','📈','Insights'],['form','🎀','Edit form'],['archive','📦','Archive']].map(([k,e,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><b>${e}</b>${l}</button>`).join('');
 $('#app').innerHTML={today:vToday,insights:vInsights,form:vForm,archive:vArchive}[tab]();
}
function go(t){tab=t;viewing=null;render();scrollTo(0,0)}

function vToday(){
 curDate=entryDate();
 if(!isOpen()&&!unlocked)return `<h1>Pocket Diary</h1><p class="sub">Your nightly check-in</p><div class="card lock"><div class="e">🌙</div><h2>The diary is sleeping</h2><p class="sub">It wakes up at 9 pm and stays open until 3 am. Late nights count for the day before.</p><button class="btn alt" onclick="unlocked=true;render()">Peek anyway</button></div>`;
 if(!cur.__d||cur.__d!==curDate){cur={...(S.entries[curDate]||{}),__d:curDate}}
 const done=S.entries[curDate]?'✨ Already saved. You can edit it.':'';
 return `<h1>Tonight, ${new Date(curDate+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h1><p class="sub">${done||'Five minutes, then sleep well.'}</p>`+
 S.schema.map(s=>{const fs=s.fields.filter(f=>!f.archived);if(!fs.length)return '';return `<div class="card"><h2>${s.emoji} ${esc(s.title)}</h2>${fs.map(fieldHTML).join('')}</div>`}).join('')+
 `<div style="text-align:center"><button class="btn" onclick="saveDay()">Save tonight 💾</button></div>`;
}
function fieldHTML(f){
 const v=cur[f.id];const L=`<div class="lbl">${esc(f.label)}</div>`;
 if(f.type==='toggle')return `<div class="row">${L}<button class="sw ${v?'on':''}" aria-label="${esc(f.label)}" onclick="setv('${f.id}',${!v},1)"></button></div>`;
 if(f.type==='rating')return `<div class="row">${L}<div class="stars">${[1,2,3,4,5].map(i=>`<button class="${v>=i?'on':''}" onclick="setv('${f.id}',${v===i?0:i},1)">★</button>`).join('')}</div></div>`;
 if(f.type==='number')return `<div class="row">${L}<input type="number" inputmode="decimal" style="width:90px" value="${esc(v)}" oninput="setv('${f.id}',this.value===''?'':+this.value)"></div>`;
 return `<div class="row" style="display:block">${L}<div style="display:flex"><input class="txt" value="${esc(v)}" oninput="setv('${f.id}',this.value)" placeholder="Optional"><button class="mic" onclick="mic('${f.id}')" aria-label="Voice input">🎤</button></div></div>`;
}
function setv(id,v,re){cur[id]=v;if(re)render()}
function mic(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input isn’t supported here');const r=new R();r.onresult=e=>{cur[id]=((cur[id]||'')+' '+e.results[0][0].transcript).trim();render()};r.onerror=()=>toast('Couldn’t hear that');try{r.start();toast('Listening…')}catch(e){}}
async function saveDay(){const e={...cur};delete e.__d;S.entries[curDate]=e;await save();toast('Saved. Sweet dreams 🌙')}

// ---------- insights
function vInsights(){
 const fs=allFields().filter(f=>f.type!=='text');
 if(!sel||!fs.find(f=>f.id===sel))sel=fs[0]?.id;
 const days=Object.keys(S.entries).sort();
 let streak=0,d=entryDate();while(S.entries[d]){streak++;d=addDays(d,-1)}
 const f=fs.find(x=>x.id===sel);
 return `<h1>Insights</h1><p class="sub">What your nights say</p>
 <div class="big"><div><b>${days.length}</b>nights logged</div><div><b>${streak}</b>night streak 🔥</div></div><div style="height:14px"></div>
 <div class="card"><select style="width:100%" onchange="sel=this.value;render()">${fs.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.sec)}: ${esc(x.label)}</option>`).join('')}</select>${f?insightBody(f):''}</div>`;
}
function series(id,n){const out=[];const end=entryDate();for(let i=n-1;i>=0;i--){const d=addDays(end,-i);out.push({d,v:S.entries[d]?.[id]})}return out}
function insightBody(f){
 if(f.type==='toggle'){
  const s=series(f.id,70),yes=s.filter(x=>x.v).length,logged=s.filter(x=>x.v!==undefined).length;
  const end=new Date(s[s.length-1].d+'T12:00').getDay(),pad=(7-1-end+7)%7;
  return `<h2 style="margin-top:14px">Last 10 weeks</h2><div class="heat">${s.map(x=>`<i title="${x.d}" style="${x.v?'background:var(--mint)':x.v===false?'background:var(--peach)':''}"></i>`).join('')}</div><p class="sub" style="margin-top:10px">Done on <b>${yes}</b> of ${logged} logged nights${logged?' ('+Math.round(yes/logged*100)+'%)':''}. 🟩 done, 🟧 skipped.</p>`;
 }
 const s=series(f.id,30),pts=s.map((x,i)=>({i,v:typeof x.v==='number'?x.v:null})).filter(p=>p.v!==null);
 if(pts.length<2)return `<p class="sub" style="margin-top:12px">Log a couple more nights to see a trend 🌱</p>`;
 const max=Math.max(...pts.map(p=>p.v),f.type==='rating'?5:0),min=f.type==='rating'?0:Math.min(...pts.map(p=>p.v));
 const X=i=>10+i/29*300,Y=v=>110-(v-min)/((max-min)||1)*100;
 const avg=(pts.reduce((a,p)=>a+p.v,0)/pts.length).toFixed(1);
 const h=Math.floor(pts.length/2),a1=pts.slice(0,h).reduce((a,p)=>a+p.v,0)/h,a2=pts.slice(h).reduce((a,p)=>a+p.v,0)/(pts.length-h);
 const tr=a2>a1*1.05?'trending up 📈':a2<a1*.95?'trending down 📉':'holding steady 🌤️';
 return `<h2 style="margin-top:14px">Last 30 days</h2><svg viewBox="0 0 320 120" style="width:100%"><polyline fill="none" stroke="var(--pink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4" fill="var(--lav)"/>`).join('')}</svg><p class="sub">Average <b>${avg}</b> across ${pts.length} nights, ${tr}.</p>`;
}

// ---------- form editor
function vForm(){
 return `<h1>Edit your form</h1><p class="sub">Removing a question hides it. Old answers stay safe.</p>`+
 S.schema.map((s,si)=>`<div class="card"><div class="row"><input value="${esc(s.emoji)}" style="width:54px;text-align:center" onchange="S.schema[${si}].emoji=this.value;save()"><input style="flex:1" value="${esc(s.title)}" onchange="S.schema[${si}].title=this.value;save()"></div>`+
  s.fields.map((f,fi)=>f.archived?'':`<div class="row"><input style="flex:1" value="${esc(f.label)}" onchange="S.schema[${si}].fields[${fi}].label=this.value;save()"><span class="sub" style="margin:0">${f.type}</span><button class="x" onclick="rmField(${si},${fi})">✕</button></div>`).join('')+
  `<div class="row"><input id="nf${si}" style="flex:1" placeholder="New question"><select id="nt${si}"><option value="toggle">toggle</option><option value="rating">stars</option><option value="number">number</option><option value="text">text</option></select><button class="btn alt" style="padding:8px 14px" onclick="addField(${si})">＋</button></div></div>`).join('')+
 `<div class="card"><div class="row"><input id="ns" style="flex:1" placeholder="New section, e.g. Creative"><button class="btn alt" style="padding:8px 14px" onclick="addSec()">＋</button></div></div>`;
}
const uid=l=>l.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,20)+'-'+Math.random().toString(36).slice(2,6);
function rmField(si,fi){S.schema[si].fields[fi].archived=true;save();render()}
function addField(si){const l=$('#nf'+si).value.trim();if(!l)return toast('Give the question a name');S.schema[si].fields.push({id:uid(l),label:l,type:$('#nt'+si).value});save();render()}
function addSec(){const l=$('#ns').value.trim();if(!l)return toast('Give the section a name');S.schema.push({id:uid(l),title:l,emoji:'🌟',fields:[]});save();render()}

// ---------- archive
function vArchive(){
 if(viewing)return vViewing();
 const end=addDays(S.cycleStart,S.cycle-1),used=Math.max(0,Math.round((new Date(entryDate()+'T12:00')-new Date(S.cycleStart+'T12:00'))/864e5)+1),pct=Math.min(100,used/S.cycle*100);
 return `<h1>Archive</h1><p class="sub">Bundle a stretch of life into one file</p>
 <div class="card"><h2>Current chapter</h2><div class="bar"><i style="width:${pct}%"></i></div><p class="sub" style="margin-top:8px">Day ${used} of ${S.cycle}. Suggested wrap-up: ${end}</p>
 <div class="row"><span class="lbl">Chapter length: <b id="cl">${S.cycle}</b> days</span><input type="range" min="20" max="45" value="${S.cycle}" oninput="S.cycle=+this.value;$('#cl').textContent=this.value" onchange="save();render()"></div>
 <div class="row"><span class="lbl">Started on</span><input type="date" value="${S.cycleStart}" onchange="S.cycleStart=this.value;save();render()"></div>
 <div style="text-align:center;margin-top:10px"><button class="btn" onclick="doArchive()">Archive this chapter</button></div></div>
 <div class="card"><h2>Open an old chapter</h2><p class="sub">Pick a saved .json file.</p><input type="file" accept=".json,application/json" onchange="imp(this.files[0])"></div>
 ${S.archives.length?`<div class="card"><h2>Past chapters</h2>${S.archives.map(a=>`<div class="row"><span class="lbl">${esc(a.title)}<br><small class="sub">${a.from} to ${a.to}</small></span></div>`).join('')}</div>`:''}`;
}
async function doArchive(){
 const title=prompt('Name this chapter (e.g. “Oct–Nov: Project Moonlight”)');if(!title)return;
 const to=entryDate(),keys=Object.keys(S.entries).filter(k=>k>=S.cycleStart&&k<=to).sort();
 if(!keys.length)return toast('No entries in this chapter yet');
 const data={app:'pocket-diary',title,from:S.cycleStart,to,schema:S.schema,entries:Object.fromEntries(keys.map(k=>[k,S.entries[k]]))};
 const json=JSON.stringify(data,null,1);
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=title.replace(/[^\w-]+/g,'_')+'.json';a.click()}catch(e){}
 try{await navigator.clipboard.writeText(json);toast('File saved and copied 📦')}catch(e){toast('Archive made 📦')}
 if(confirm('Remove these '+keys.length+' days from the live diary to keep it light? (Make sure your file saved!)'))keys.forEach(k=>delete S.entries[k]);
 S.archives.push({title,from:S.cycleStart,to});S.cycleStart=addDays(to,1);await save();render();
}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='pocket-diary')throw 0;viewing=d;render()}catch(e){toast('That doesn’t look like a diary file')}};r.readAsText(f)}
function vViewing(){
 const d=viewing,ks=Object.keys(d.entries).sort();
 const rows=allFields(d.schema).map(f=>{const vs=ks.map(k=>d.entries[k][f.id]).filter(v=>v!==undefined&&v!=='');if(!vs.length)return '';
  let t;if(f.type==='toggle')t=vs.filter(Boolean).length+' of '+vs.length+' nights';else if(f.type==='text')t=vs.length+' notes';else t='avg '+(vs.reduce((a,b)=>a+(+b||0),0)/vs.length).toFixed(1);
  return `<div class="row"><span class="lbl">${esc(f.label)}</span><b>${t}</b></div>`}).join('');
 const words=ks.map(k=>`<div class="row" style="display:block"><b>${k}</b> ${allFields(d.schema).filter(f=>f.type==='text'&&d.entries[k][f.id]).map(f=>esc(d.entries[k][f.id])).join(', ')}</div>`).join('');
 return `<h1>${esc(d.title)}</h1><p class="sub">${d.from} to ${d.to}, ${ks.length} nights</p><div class="card">${rows}</div><div class="card"><h2>Notes</h2>${words}</div><button class="btn ghost" onclick="viewing=null;render()">Back</button>`;
}

(async()=>{const s=await idbGet('state');if(s)S=Object.assign(S,s);render();setInterval(()=>{if(tab==='today'&&!document.activeElement?.matches('input'))render()},60000)})();
</script></body></html>
