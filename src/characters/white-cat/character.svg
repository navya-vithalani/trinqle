    <ellipse cx="100" cy="86" rx="46" ry="40" fill="#fff" stroke="#e7d6e0" stroke-width="3"/>
    <circle cx="68" cy="96" r="8" fill="#ffc2d6" opacity=".6"/>
    <circle cx="132" cy="96" r="8" fill="#ffc2d6" opacity=".6"/>
    <g id="eye-left" data-origin="50% 50%"><ellipse cx="80" cy="84" rx="5" ry="6.5" fill="#5b4350"/><circle cx="82" cy="82" r="1.8" fill="#fff"/></g>
    <g id="eye-right" data-origin="50% 50%"><ellipse cx="120" cy="84" rx="5" ry="6.5" fill="#5b4350"/><circle cx="122" cy="82" r="1.8" fill="#fff"/></g>
    <path d="M96 95 L104 95 L100 100 Z" fill="#ff8fb1"/>
