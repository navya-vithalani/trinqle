    <g id="leg-left" data-origin="50% 0%"><ellipse cx="80" cy="180" rx="15" ry="9" fill="#fff" stroke="#e7d6e0" stroke-width="3"/></g>
    <g id="leg-right" data-origin="50% 0%"><ellipse cx="120" cy="180" rx="15" ry="9" fill="#fff" stroke="#e7d6e0" stroke-width="3"/></g>
  </g>
  <g id="head" data-origin="50% 90%">
