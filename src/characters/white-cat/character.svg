<svg id="character" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Layer ids are the animation contract: tail, body, head, ear-left, ear-right, eye-left, eye-right, mouth, leg-left, leg-right. Add as many limbs as needed (leg-1..leg-N). -->
  <g id="tail" data-origin="20% 90%">
    <path d="M52 150 C14 150 6 108 30 92 C40 86 46 96 38 104 C28 114 36 134 58 134 Z" fill="#fff" stroke="#e7d6e0" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="body" data-origin="50% 100%">
